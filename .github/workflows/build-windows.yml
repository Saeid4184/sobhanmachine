name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copy shared web code
        run: |
          if (Test-Path desktop/www) { Remove-Item -Recurse -Force desktop/www }
          Copy-Item -Recurse www desktop/www

      - name: Install packages
        working-directory: desktop
        run: npm install

      - name: Build exe
        working-directory: desktop
        run: npx electron-builder --win --publish never

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sobhan-beton-windows
          path: |
            desktop/dist/*.exe
