<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دستیار کارخانه بتن سبحان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f4f6f8; --surface:#ffffff; --surface2:#eef1f5; --line:#d9dee6;
  --text:#16202b; --muted:#64748b; --brand:#1f6feb; --brand-ink:#ffffff;
  --ok:#128a4e; --warn:#b4690e; --bad:#c0392b; --accent:#6d4aff;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0e1319; --surface:#161d26; --surface2:#1e2732; --line:#2a3542;
    --text:#e8edf4; --muted:#93a1b3; --brand:#4b8dff; --brand-ink:#08121f;
    --ok:#3ecf8e; --warn:#f0b429; --bad:#ff6b5e; --accent:#a78bfa;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e1319; --surface:#161d26; --surface2:#1e2732; --line:#2a3542;
  --text:#e8edf4; --muted:#93a1b3; --brand:#4b8dff; --brand-ink:#08121f;
  --ok:#3ecf8e; --warn:#f0b429; --bad:#ff6b5e; --accent:#a78bfa;
}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Vazirmatn", system-ui, "Segoe UI", Tahoma, sans-serif;
  font-size:15px; line-height:1.7; -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.head-row{display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{width:34px;height:34px;border-radius:10px;background:#fff;object-fit:contain;color:var(--brand-ink);
  display:grid;place-items:center;font-weight:700;font-size:10px;flex:none;overflow:hidden}
.title{font-weight:700;font-size:16px;line-height:1.3}
.sub{font-size:11px;color:var(--muted);line-height:1.3}
.spacer{flex:1}
.icon-btn{background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:6px 10px;font-family:inherit;font-size:13px;cursor:pointer}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 10px 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:none;background:var(--surface2);border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:7px 13px;font-family:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
nav button.active{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
main{padding:14px 12px 90px;max-width:900px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px}
.kpi .n{font-size:22px;font-weight:700;line-height:1.2}
.kpi .l{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{font-size:12px;color:var(--muted);display:block;margin:6px 0 3px}
input,select,textarea{
  width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:9px 10px;font-family:inherit;font-size:14px}
textarea{min-height:70px;resize:vertical}
button.primary{background:var(--brand);color:var(--brand-ink);border:none;border-radius:10px;
  padding:10px 14px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:10px;
  padding:7px 11px;font-family:inherit;font-size:13px;cursor:pointer}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--line);border-radius:10px;
  padding:7px 11px;font-family:inherit;font-size:13px;cursor:pointer}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:9px;background:var(--surface)}
.item .t{font-weight:700;font-size:14px}
.item .m{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface2);color:var(--muted);margin-inline-start:6px}
.tag.due{background:rgba(192,57,43,.14);color:var(--bad);border-color:transparent}
.tag.soon{background:rgba(180,105,14,.16);color:var(--warn);border-color:transparent}
.tag.ok{background:rgba(18,138,78,.14);color:var(--ok);border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px}
.chart{width:100%;height:190px;display:block;overflow-x:auto}
.scrollx{overflow-x:auto}
details summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"＋ ";color:var(--brand)}
details[open] summary::before{content:"− ";}
.chatbox{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px;
  white-space:pre-wrap;min-height:60px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:999px;
  padding:6px 11px;font-family:inherit;font-size:12.5px;cursor:pointer}
.note{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand)}
hr{border:none;border-top:1px solid var(--line);margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:460px}
th,td{border-bottom:1px solid var(--line);padding:6px;text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:500}
.ck{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:none}
.ck .box{width:28px;height:28px;flex:none;border-radius:8px;border:2px solid var(--line);background:var(--surface2);
  color:#fff;font-weight:700;font-size:16px;cursor:pointer;padding:0;font-family:inherit}
.ck.on .box{background:var(--ok);border-color:var(--ok)}
.ck .ct{flex:1;background:none;border:none;color:var(--text);text-align:right;font-family:inherit;font-size:14px;padding:3px 0;cursor:pointer}
.ck.on .ct{color:var(--muted);text-decoration:line-through}
.ck .x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 6px;line-height:1}
#remBanner .rb{margin:0 10px 10px;background:var(--warn);color:#1a1200;border-radius:12px;padding:10px 12px;font-size:14px}
#remBanner .rb .ghost{color:#1a1200;border-color:rgba(0,0,0,.3)}
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}
.modal[hidden],.lock[hidden]{display:none}
.modal img.full{max-width:100%;max-height:82vh;border-radius:12px;display:block}
.jdbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;max-width:360px}
.jdhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.jdgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.jdgrid i{font-style:normal;font-size:12px;color:var(--muted)}
.jdd{background:var(--surface2);border:1px solid transparent;border-radius:9px;padding:7px 0;font-family:inherit;font-size:14px;color:var(--text);cursor:pointer}
.jdd.today{border-color:var(--brand)}
.jdd.sel{background:var(--brand);color:var(--brand-ink);font-weight:700}
.jdbtn{width:100%;text-align:right;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 10px;font-family:inherit;font-size:14px;cursor:pointer}
.mrow{display:block;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:9px;font-family:inherit;color:var(--text);cursor:pointer}
.mrow .t{font-weight:700;font-size:14px}.mrow .m{font-size:12px;color:var(--muted)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumb{width:64px;height:64px;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:20px}
.lockbox{width:100%;max-width:300px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.jdbox h3{font-size:15px}
.par{margin-bottom:10px}.par .pl{font-size:13.5px;font-weight:500}.par .pv{font-size:12px;color:var(--muted)}
.kpirow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.kpirow:last-of-type{border-bottom:none}
.kpirow .t{font-weight:700;font-size:14px}.kpirow .m{font-size:12px;color:var(--muted)}.kv{font-weight:700;font-size:17px;white-space:nowrap}.kv small{font-size:11px;color:var(--muted);font-weight:400}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none}.dot.g{background:var(--ok)}.dot.y{background:var(--warn)}.dot.r{background:var(--bad)}
.chatlog{max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.msg{padding:8px 11px;border-radius:12px;white-space:pre-wrap;font-size:14px;max-width:92%}
.msg.u{align-self:flex-start;background:var(--brand);color:var(--brand-ink)}.msg.a{align-self:flex-end;background:var(--surface2)}
details.item>summary{font-size:14px}
.fab{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:54px;height:54px;border-radius:50%;border:none;
  background:var(--accent);color:#fff;font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.advice{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--surface2);font-size:13px;line-height:1.9}
.linkbtn{background:none;border:none;color:var(--brand);font-family:inherit;font-size:13px;padding:0;cursor:pointer;text-decoration:underline}
.grid3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;margin-top:4px}.grid3 input,.grid3 select{padding:8px 6px;font-size:13px}
.attrow{padding:8px 0;border-bottom:1px solid var(--line)}.attrow .t{font-weight:700;font-size:14px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.calg i{font-style:normal;font-size:12px;color:var(--muted)}
.cd{display:inline-block;padding:5px 0;border-radius:7px;background:var(--surface2);font-size:12.5px}.cd.sm{width:12px;height:12px;padding:0;vertical-align:middle;margin-inline-start:8px}
.cd.ok{background:rgba(18,138,78,.28)}.cd.soon{background:rgba(180,105,14,.32)}.cd.lv{background:rgba(109,74,255,.28)}.cd.due{background:rgba(192,57,43,.32)}
.tag.lv{background:rgba(109,74,255,.15);color:var(--accent);border-color:transparent}
.chks{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0}.chks label{display:flex;align-items:center;gap:6px;margin:0;color:var(--text);font-size:14px}
</style>
</head>

<script>
/* ---------- وضعیت ---------- */
const TABS=[
  ["dash","داشبورد"],["fleet","ناوگان زنده"],["sms","پیام رانندگان"],["perf","عملکرد پرسنل و ماشین‌آلات"],["check","چک‌لیست و یادآوری"],["mach","ماشین‌آلات و خرابی"],["pm","تعمیر و نگهداری"],["wash","کارواش و زیباسازی"],
  ["batch","بچینگ و تولید"],["mat","مواد اولیه"],["plan","برنامه کارخانه"],["dir","دستورات مدیر"],["safety","ایمنی و حوادث"],["notes","یادداشت و ایده‌ها"],["rep","گزارش و نمودار"],["ai","دستیار و پیشنهادها"],["set","تنظیمات"]
];
const MTYPES=["میکسر","پمپ بتن","لودر","کمپرسی","بچینگ","دیزل ژنراتور","تانکر آب","سایر"];
let tab = (location.hash||"#dash").slice(1);
if(!TABS.some(t=>t[0]===tab)) tab="dash";

const COLS=["machines","tasks","prod","ideas","check","ticks","rem","faults","log","trips","fuel","tires","stops","mixes","batches","calib","counts","receipts","reports","incidents","looks","notes","contacts","sms","att","washes","jobs"];
const S={machines:[],tasks:[],prod:[],ideas:[],check:[],ticks:[],rem:[],faults:[],log:[],trips:[],fuel:[],tires:[],stops:[],mixes:[],batches:[],calib:[],counts:[],receipts:[],reports:[],incidents:[],looks:[],notes:[],contacts:[],sms:[],att:[],washes:[],jobs:[]};
let DB=null, SAMPLE=null, ready=false;

const LS={
  get(k,d){try{const v=localStorage.getItem("sb_"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("sb_"+k,JSON.stringify(v))}catch(e){}}
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const localISO=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayISO=()=>localISO(new Date());
const toEn=s=>String(s==null?"":s).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
const gv=n=>{const el=document.getElementById(n);return el?el.value.trim():""};

/* ---------- تقویم شمسی ---------- */
const JM=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const jdiv=(a,b)=>~~(a/b);
function jalCal(jy){const br=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
 let gy=jy+621,leapJ=-14,jp=br[0],jm,jump,leap,n,i;
 for(i=1;i<br.length;i++){jm=br[i];jump=jm-jp;if(jy<jm)break;leapJ+=jdiv(jump,33)*8+jdiv(jump%33,4);jp=jm;}
 n=jy-jp;leapJ+=jdiv(n,33)*8+jdiv(n%33+3,4);if(jump%33===4&&jump-n===4)leapJ+=1;
 const leapG=jdiv(gy,4)-jdiv((jdiv(gy,100)+1)*3,4)-150, march=20+leapJ-leapG;
 if(jump-n<6)n=n-jump+jdiv(jump+4,33)*33;leap=((n+1)%33-1)%4;if(leap===-1)leap=4;
 return{leap,gy,march};}
function g2d(gy,gm,gd){let d=jdiv((gy+jdiv(gm-8,6)+100100)*1461,4)+jdiv(153*((gm+9)%12)+2,5)+gd-34840408;return d-jdiv(jdiv(gy+100100+jdiv(gm-8,6),100)*3,4)+752;}
function d2g(jdn){let j=4*jdn+139361631;j=j+jdiv(jdiv(4*jdn+183187720,146097)*3,4)*4-3908;const i=jdiv(j%1461,4)*5+308;const gd=jdiv(i%153,5)+1,gm=jdiv(i,153)%12+1,gy=jdiv(j,1461)-100100+jdiv(8-gm,6);return{gy,gm,gd};}
function j2d(jy,jm,jd){const r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-jdiv(jm,7)*(jm-7)+jd-1;}
function d2j(jdn){const gy=d2g(jdn).gy;let jy=gy-621;const r=jalCal(jy);const f=g2d(gy,3,r.march);let jm,jd,k=jdn-f;
 if(k>=0){if(k<=185){jm=1+jdiv(k,31);jd=k%31+1;return{jy,jm,jd};}k-=186;}else{jy-=1;k+=179;if(r.leap===1)k+=1;}
 jm=7+jdiv(k,30);jd=k%30+1;return{jy,jm,jd};}
function isoToJ(iso){const[y,m,d]=iso.split("-").map(Number);return d2j(g2d(y,m,d));}
function jToIso(jy,jm,jd){const g=d2g(j2d(jy,jm,jd));return g.gy+"-"+String(g.gm).padStart(2,"0")+"-"+String(g.gd).padStart(2,"0");}
function jMonthLen(jy,jm){return jm<=6?31:jm<=11?30:(jalCal(jy).leap===0?30:29);}
let jdState=null;
function jdate(id,iso){return `<input type="hidden" id="${id}" value="${iso||""}"><button type="button" class="jdbtn" data-jd="${id}" id="${id}_b">${iso?jal(iso):"انتخاب تاریخ"}</button>`;}

/* ---------- ذخیره‌سازی (IndexedDB) ---------- */
const DBS={db:null,
  open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open("sb_data",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));},
  async get(k){const d=await this.open();return new Promise((res,rej)=>{const r=d.transaction("kv").objectStore("kv").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  async set(k,v){const d=await this.open();return new Promise((res,rej)=>{const tx=d.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});}};
const pending={}; let saveWarned=false;
function persist(col){ const run=async()=>{ try{ await DBS.set(col,S[col]); }catch(e){ if(!saveWarned){ saveWarned=true; alert("ذخیره داده با خطا مواجه شد: "+((e&&e.message)||e)+"\nلطفاً از تنظیمات پشتیبان بگیرید."); } } };
  pending[col]=(pending[col]||Promise.resolve()).then(run); return pending[col]; }
async function loadData(){
  try{
    if(!(await DBS.get("__migrated"))){
      for(const c of COLS) await DBS.set(c,LS.get(c,[]));
      await DBS.set("__migrated",todayISO());
      for(const c of COLS) try{ localStorage.removeItem("sb_"+c); }catch(e){}
    }
    for(const c of COLS){ const v=await DBS.get(c); S[c]=Array.isArray(v)?v:[]; }
    try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  }catch(e){ for(const c of COLS) S[c]=LS.get(c,[]); alert("پایگاه داده باز نشد؛ داده‌ها موقتاً از حافظه قدیمی خوانده شد."); }
}

async function save(col,obj){
  if(!obj.id) obj.id=uid();
  const i=S[col].findIndex(x=>x.id===obj.id);
  if(i<0) S[col].push(obj); else S[col][i]=obj;
  render(); await persist(col);
  if(col==="contacts") pushWatch();
  if(["rem","machines","tasks","calib","contacts"].includes(col)) syncNotifications();
}
async function del(col,id){
  S[col]=S[col].filter(x=>x.id!==id); render(); await persist(col);
  if(col==="contacts") pushWatch();
  if(["rem","machines","tasks","calib","contacts"].includes(col)) syncNotifications();
}

const mName=id=>(S.machines.find(m=>m.id===id)||{}).name||"عمومی";

const unitName=m=>m&&m.unit==="km"?"کیلومتر":"ساعت";
const mUsage=m=>+(m&&m.usage!=null?m.usage:(m&&m.hours))||0;
function st(t){
  let res=null;
  if(t.due){const d=days(t.due,todayISO());
    res= d<0?[`${fa(-d)} روز عقب‌افتاده`,"due",0]: d===0?["امروز","due",0]: d<=3?[`${fa(d)} روز دیگر`,"soon",1]:[jal(t.due),"ok",2];}
  const m=t.usageInterval>0&&S.machines.find(x=>x.id===t.machineId);
  if(m){const left=(+t.lastUsage||0)+(+t.usageInterval)-mUsage(m), u=unitName(m);
    const r= left<=0?[`${fa(-left)} ${u} گذشته`,"due",0]: left<=t.usageInterval*0.1?[`${fa(left)} ${u} مانده`,"soon",1]:[`${fa(left)} ${u} مانده`,"ok",2];
    if(!res||r[2]<res[2]) res=r;}
  return res?[res[0],res[1]]:["بدون تاریخ",""];
}

function chart(type,labels,values,color){
  const W=Math.max(320,labels.length*44), H=180, P={t:14,r:10,b:26,l:38};
  const max=Math.max(1,...values), iw=W-P.l-P.r, ih=H-P.t-P.b;
  const x=i=>P.l+(labels.length<2?iw/2:i*iw/(labels.length-1));
  const y=v=>P.t+ih-(v/max)*ih;
  let g="";
  for(let i=0;i<=3;i++){const yy=P.t+ih-(i/3)*ih;
    g+=`<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`+
       `<text x="${P.l-5}" y="${yy+4}" fill="var(--muted)" font-size="9" text-anchor="end">${Math.round(max*i/3)}</text>`;}
  let body="";
  if(type==="bar"){
    const bw=Math.max(8,iw/Math.max(1,labels.length)*0.55);
    values.forEach((v,i)=>{const cx=P.l+(i+0.5)*iw/labels.length;
      body+=`<rect x="${cx-bw/2}" y="${y(v)}" width="${bw}" height="${P.t+ih-y(v)}" rx="3" fill="${color}"/>`;});
  }else{
    const pts=values.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
    body=`<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>`+
         values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.8" fill="${color}"/>`).join("");
  }
  const step=Math.ceil(labels.length/7);
  const lab=labels.map((l,i)=> i%step? "" :
    `<text x="${type==="bar"?P.l+(i+0.5)*iw/labels.length:x(i)}" y="${H-8}" fill="var(--muted)" font-size="9" text-anchor="middle">${l}</text>`).join("");
  return `<div class="scrollx"><svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:${W}px">${g}${body}${lab}</svg></div>`;
}

const TRIP_TYPES=["میکسر","پمپ بتن","تانکر آب"];
const STAGES={1:["در مسیر رفت","soon"],2:["در حال تخلیه","due"],3:["در مسیر برگشت","soon"]};
const NEXT_LABEL={1:"رسید به محل",2:"پایان تخلیه",3:"برگشت به کارگاه"};
let fleetDay=null, perfDays=7;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const dtNow=()=>todayISO()+"T"+nowHM();
const mins=(a,b)=>(a&&b)?Math.round((new Date(b)-new Date(a))/60000):null;
const hm=dt=>dt?faNum(dt.slice(11,16)):"—";
const dur=(a,b)=>{const m=mins(a,b);return m!=null&&m>=0?fa(m):"—"};
const activeTrip=mid=>S.trips.find(t=>t.machineId===mid&&t.stage<4);
const cycleStd=()=>+LS.get("cycleStd",90)||90;
const tripCycle=t=>mins(t.tDepart,t.tReturn);
const rateUnit=m=>m&&m.unit==="km"?"لیتر/۱۰۰ کیلومتر":"لیتر/ساعت";
function mState(m){
  if(m.status==="در تعمیر") return ["در تعمیر","due",4];
  if(m.status==="غیرفعال") return ["غیرفعال","",5];
  const t=activeTrip(m.id); if(t) return [STAGES[t.stage][0],STAGES[t.stage][1],t.stage===2?0:1];
  return ["در کارگاه • آماده","ok",2];
}
function perfRows(n){const from=addDays(todayISO(),-(n-1)), by={};
  for(const x of S.trips.filter(x=>x.date>=from)){const k=x.driver||"نامشخص";
    const r=by[k]||(by[k]={d:k,n:0,v:0,c:[],late:0,days:new Set()}); r.n++; r.v+=+x.volume||0; r.days.add(x.date);
    const c=tripCycle(x); if(c>0){r.c.push(c); if(c>cycleStd()) r.late++;}}
  return Object.values(by).map(r=>Object.assign(r,{faults:S.faults.filter(f=>f.date>=from&&(S.machines.find(m=>m.id===f.machineId)||{}).driver===r.d).length}))
    .sort((a,b)=>b.n-a.n);}
function fuelRates(){const res={};
  for(const m of S.machines){const rs=S.fuel.filter(f=>f.machineId===m.id&&+f.usage>0).sort((a,b)=>a.usage-b.usage), rates=[];
    for(let i=1;i<rs.length;i++){const du=rs[i].usage-rs[i-1].usage; if(du>0) rates.push({id:rs[i].id,r:rs[i].liters/du*(m.unit==="km"?100:1)});}
    for(const x of rates){const o=rates.filter(y=>y!==x).map(y=>y.r), mean=avg(o); res[x.id]={r:x.r,abn:o.length>=2&&x.r>mean*1.2,mean};}}
  return res;}
function fuelItem(f,rates){const m=S.machines.find(x=>x.id===f.machineId), r=rates[f.id];
  return `<div class="item"><div class="t">${esc(mName(f.machineId))} • ${fa(f.liters)} لیتر${r&&r.abn?'<span class="tag due">مصرف غیرعادی</span>':""}</div>
   <div class="m">${jal(f.date)}${f.usage?` • در ${fa(f.usage)} ${unitName(m)}`:""}${r?` • ${fa(+r.r.toFixed(1))} ${rateUnit(m)}${r.abn?` (میانگین ${fa(+r.mean.toFixed(1))})`:""}`:""}${f.cost?` • ${fa(f.cost)} تومان`:""}</div>
   <div class="row" style="margin-top:6px"><button class="danger" data-fueldel="${f.id}">حذف</button></div></div>`;}

function qrMatrix(text){
  const data=[...new TextEncoder().encode(text)];
  const T={1:[10,[[1,16]]],2:[16,[[1,28]]],3:[26,[[1,44]]],4:[18,[[2,32]]],5:[24,[[2,43]]],6:[16,[[4,27]]]};
  const AL={1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34]};
  let ver=0; for(let v=1;v<=6;v++){const cap=T[v][1].reduce((a,[n,d])=>a+n*d,0); if(12+data.length*8<=cap*8){ver=v;break;}}
  if(!ver) throw new Error("QR too long");
  const [ecn,groups]=T[ver], cap=groups.reduce((a,[n,d])=>a+n*d,0), bits=[];
  const put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1)};
  put(4,4); put(data.length,8); data.forEach(b=>put(b,8)); put(0,Math.min(4,cap*8-bits.length)); while(bits.length%8) bits.push(0);
  const cw=[]; for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];cw.push(b);}
  for(let p=0xEC;cw.length<cap;p^=0xEC^0x11) cw.push(p);
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x;}return z;};
  const div=(()=>{const r=Array(ecn).fill(0);r[ecn-1]=1;let root=1;for(let i=0;i<ecn;i++){for(let j=0;j<r.length;j++){r[j]=mul(r[j],root);if(j+1<r.length)r[j]^=r[j+1];}root=mul(root,2);}return r;})();
  const rem=d=>{const r=div.map(()=>0);for(const b of d){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f));}return r;};
  const blocks=[]; let k=0; for(const [n,d] of groups) for(let i=0;i<n;i++){const dd=cw.slice(k,k+d);k+=d;blocks.push([dd,rem(dd)]);}
  const fin=[], maxD=Math.max(...blocks.map(b=>b[0].length));
  for(let i=0;i<maxD;i++) for(const b of blocks) if(i<b[0].length) fin.push(b[0][i]);
  for(let i=0;i<ecn;i++) for(const b of blocks) fin.push(b[1][i]);
  const N=17+4*ver, M=[...Array(N)].map(()=>Array(N).fill(false)), F=[...Array(N)].map(()=>Array(N).fill(false));
  const set=(x,y,v)=>{M[y][x]=!!v;F[y][x]=true;};
  for(let i=0;i<N;i++){set(6,i,i%2===0);set(i,6,i%2===0);}
  const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const x=cx+dx,y=cy+dy;if(x<0||y<0||x>=N||y>=N)continue;const d=Math.max(Math.abs(dx),Math.abs(dy));set(x,y,d!==2&&d!==4);}};
  finder(3,3);finder(N-4,3);finder(3,N-4);
  const al=AL[ver];
  for(let i=0;i<al.length;i++)for(let j=0;j<al.length;j++){if((i===0&&j===0)||(i===0&&j===al.length-1)||(i===al.length-1&&j===0))continue;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(al[i]+dx,al[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);}
  const fmt=mask=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>(b>>>i)&1;
    for(let i=0;i<=5;i++)set(8,i,g(i)); set(8,7,g(6)); set(8,8,g(7)); set(7,8,g(8));
    for(let i=9;i<15;i++)set(14-i,8,g(i)); for(let i=0;i<8;i++)set(N-1-i,8,g(i)); for(let i=8;i<15;i++)set(8,N-15+i,g(i)); set(8,N-8,1);};
  fmt(0);
  let i=0; for(let right=N-1;right>=1;right-=2){ if(right===6) right=5;
    for(let vert=0;vert<N;vert++) for(let j=0;j<2;j++){const x=right-j, up=((right+1)&2)===0, y=up?N-1-vert:vert;
      if(!F[y][x]&&i<fin.length*8){M[y][x]=((fin[i>>>3]>>>(7-(i&7)))&1)===1;i++;}}}
  const cond=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,
    (x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  const apply=m=>{for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!F[y][x]&&cond[m](x,y))M[y][x]=!M[y][x];};
  const pen=()=>{let p=0;for(let a=0;a<2;a++)for(let y=0;y<N;y++){let run=1;for(let x=1;x<=N;x++){const c=x<N&&(a?M[x][y]:M[y][x])===(a?M[x-1][y]:M[y][x-1]);if(c)run++;else{if(run>=5)p+=run-2;run=1;}}}
    for(let y=0;y<N-1;y++)for(let x=0;x<N-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3;}
    let dark=0;M.forEach(r=>r.forEach(v=>dark+=v));p+=Math.floor(Math.abs(dark*20-N*N*10)/(N*N))*10;return p;};
  let best=0,bp=1e9; for(let m=0;m<8;m++){apply(m);fmt(m);const p=pen();if(p<bp){bp=p;best=m;}apply(m);}
  apply(best); fmt(best); return M;
}

async function washRotate(){const iv=+toEn(gv("wiv"))||7, cap=Math.max(1,+toEn(gv("wcap"))||2), fri=document.getElementById("wfri").checked;
  LS.set("washRot",{iv,cap,fri});
  const ms=S.machines.filter(m=>TRIP_TYPES.includes(m.type)&&m.status!=="غیرفعال"); if(!ms.length) return alert("دستگاه میکسر، پمپ یا تانکر فعالی ثبت نشده.");
  const lw=m=>S.log.filter(l=>l.machineId===m.id&&l.kind==="wash").map(l=>l.date).sort().pop()||"";
  for(const t of S.tasks.filter(x=>x.kind==="wash"&&x.rot&&x.status!=="done")) await del("tasks",t.id);
  const start=addDays(todayISO(),1), cnt={};
  for(const m of [...ms].sort((a,b)=>lw(a).localeCompare(lw(b)))){ const l=lw(m); let d=l&&addDays(l,iv)>start?addDays(l,iv):start;
    for(let g=0;g<120;g++){ if((!fri||new Date(d+"T12:00:00").getDay()!==5)&&(cnt[d]||0)<cap) break; d=addDays(d,1); }
    cnt[d]=(cnt[d]||0)+1;

  alert("نوبت‌ها چیده شد."); }

  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||("کد خطا "+r.status)); return j;}
const SET_KEYS=["kpiT","minStock","capM3h","planH","cycleStd","moist","washRot","seeded"];

/* ---------- پیام رانندگان (SMS) ---------- */
const FSTOP=["خرابی","ترافیک / مسیر","صف بارگیری / معدن","انتظار در پروژه","سوخت‌گیری","مدارک / پلیس راه","آب و هوا","استراحت / غذا","سایر"];
const SMS_T={fault:"خرابی",stop:"توقف",incident:"حادثه / ایمنی",report:"گزارش عمومی"}, SMS_C={fault:"due",stop:"soon",incident:"due",report:""};
let smsF="new", smsBusy=false;
const SMSP=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SmsReader;
const normPhone=n=>{const d=toEn(String(n||"")).replace(/\D/g,""); return d.length>10?d.slice(-10):d;};
const contactOf=ph=>{const k=normPhone(ph); return S.contacts.find(c=>normPhone(c.phone)===k);};
const smsMin=x=>(x.type==="stop"||x.type==="fault")?(+x.minutes||0):0;
async function pushWatch(){const P=SMSP(); if(!P) return; try{ await P.setWatchList({drivers:S.contacts.map(c=>({phone:c.phone,name:c.name})),notify:LS.get("smsNotify",true)}); }catch(e){}}
function smsRule(body){const t=toEn(body||""); let type="report", cause=null, minutes=null;
  if(/تصادف|حادثه|آسیب|زخمی|مصدوم|واژگون|چپ کرد|برخورد/.test(t)) type="incident";
  else if(/خراب|پنچر|ترکید|نشت|روغن|گیربکس|موتور|ترمز|باتری|استارت|کلاچ|جوش آورد|هیدرولیک|جک|خاموش شد|روشن نمی|باد ندار|شکست/.test(t)) type="fault";
  else if(/توقف|معطل|منتظر|ایستاد|انتظار|ترافیک|صف |صف‌|راه بسته|پلیس|سوخت|گازوئیل|ناهار|نهار|استراحت|برف|باران|طوفان/.test(t)) type="stop";
  const h=/(\d+(?:[.\/٫]\d+)?)\s*ساعت/.exec(t), m=/(\d+)\s*(?:دقیقه|دقيقه|min)/.exec(t);
  if(h) minutes=Math.round(parseFloat(h[1].replace(/[\/٫]/,"."))*60); if(m) minutes=(minutes||0)+ +m[1];
  if(minutes==null){ if(/نیم ساعت/.test(t)) minutes=30; else if(/یک ساعت|یه ساعت/.test(t)) minutes=60; else if(/ربع ساعت/.test(t)) minutes=15; }
  if(type==="fault") cause="خرابی";
  if(type==="stop") cause=/ترافیک|راه بسته|مسیر/.test(t)?"ترافیک / مسیر":/صف|معدن|بارگیری/.test(t)?"صف بارگیری / معدن":/پروژه|کارفرما|منتظر/.test(t)?"انتظار در پروژه":
    /سوخت|گازوئیل/.test(t)?"سوخت‌گیری":/پلیس|مدارک|جریمه|توقیف/.test(t)?"مدارک / پلیس راه":/برف|باران|طوفان/.test(t)?"آب و هوا":/نهار|ناهار|استراحت|نماز/.test(t)?"استراحت / غذا":"سایر";
  return {type,cause,minutes};}
function smsRecord(id,ts,phone,body){const c=contactOf(phone), d=new Date(+ts), r=smsRule(body);
  return {id,ts:+ts,date:localISO(d),time:String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"),phone:normPhone(phone),
    contactId:c?c.id:"",driver:c?c.name:"",machineId:c?(c.machineId||""):"",body,type:r.type,cause:r.cause,minutes:r.minutes,status:"new",ai:false};}
async function syncSms(manual,backDays){const P=SMSP();
  if(!P){ if(manual) alert("خواندن پیامک فقط در نسخه نصبی اندروید کار می‌کند."); return; }
  if(!S.contacts.length){ if(manual) alert("ابتدا شماره رانندگان را در پایین همین صفحه ثبت کن."); return; }
  if(smsBusy) return; smsBusy=true;
  try{ let pm=await P.checkPermissions();
    if(pm.sms!=="granted"){ if(!manual) return; pm=await P.requestPermissions(); if(pm.sms!=="granted"){ alert("اجازه خواندن پیامک داده نشد."); return; } }
    await pushWatch();
    const since=backDays?Date.now()-backDays*864e5:(LS.get("smsSince",0)||Date.now()-7*864e5);
    const r=await P.readInbox({since}), msgs=(r&&r.messages)||[]; let n=0, maxTs=LS.get("smsSince",0)||0;
    for(const m of msgs){ maxTs=Math.max(maxTs,+m.date); const id="sms"+m.id; if(S.sms.some(x=>x.id===id)) continue; S.sms.push(smsRecord(id,m.date,m.phone||m.address,m.body||"")); n++; }
    LS.set("smsSince",Math.max(maxTs,LS.get("smsSince",0)||0)||Date.now()); LS.set("smsLast",Date.now());
    if(n){ await persist("sms"); render(); if(LS.get("smsAi",true)) await aiClassify(); } else if(manual) render();
    if(manual) alert(n?`${fa(n)} پیام جدید وارد شد.`:"پیام جدیدی نیست.");
  }catch(e){ if(manual) alert("خواندن پیامک ناموفق بود: "+(e.message||e)); } finally{ smsBusy=false; } }
async function aiClassify(){const cfg=LS.get("cfg",{}); if(!cfg.url||!cfg.token) return; const todo=S.sms.filter(x=>!x.ai&&!x.edited).slice(-40); if(!todo.length) return;
  const prompt=`پیامک‌های زیر را رانندگان یک کارخانه بتن برای سرپرست کارگاه فرستاده‌اند. هر پیام را دسته‌بندی کن و فقط یک آرایه JSON برگردان، بدون هیچ متن یا علامت دیگر.
قالب هر عنصر: {"id": همان شناسه, "type": "fault" یا "stop" یا "incident" یا "report", "minutes": مدت توقف به دقیقه یا null, "cause": یکی از ${JSON.stringify(FSTOP)} یا null, "title": عنوان کوتاه مشکل, "summary": خلاصه یک‌خطی فارسی}
fault یعنی خرابی دستگاه (حتی اگر مدت توقف هم گفته باشد)، stop یعنی توقف یا معطلی بدون خرابی، incident یعنی تصادف یا مسئله ایمنی، report یعنی بقیه پیام‌ها. مدت را فقط اگر در پیام آمده بنویس.
پیام‌ها: ${JSON.stringify(todo.map(x=>({id:x.id,driver:x.driver,text:x.body})))}`;
  try{ const txt=await callClaude(prompt), a=txt.indexOf("["), b=txt.lastIndexOf("]"); const arr=JSON.parse(txt.slice(a,b+1));
    for(const r of arr){ const i=S.sms.findIndex(x=>x.id===r.id); if(i<0) continue; const x=S.sms[i];
      S.sms[i]=Object.assign({},x,{ai:true,type:SMS_T[r.type]?r.type:x.type,minutes:r.minutes!=null&&!isNaN(+r.minutes)?+r.minutes:x.minutes,
        cause:FSTOP.includes(r.cause)?r.cause:(r.type==="fault"?"خرابی":x.cause),title:r.title||x.title||"",summary:r.summary||""}); }
    await persist("sms"); render(); }catch(e){} }
function smsItem(x){const st_=x.status==="new"?'<span class="tag soon">جدید</span>':x.status==="done"?'<span class="tag ok">ثبت شد</span>':'<span class="tag">بایگانی</span>';
  return `<div class="item"><div class="t">${esc(x.driver||x.phone)}<span class="tag ${SMS_C[x.type]}">${SMS_T[x.type]}</span>${st_}</div>
   <div class="m">${jal(x.date)} • ${faNum(x.time||"")}${x.machineId?" • "+esc(mName(x.machineId)):""}${x.minutes?` • ${fa(x.minutes)} دقیقه`:""}${x.cause?" • "+esc(x.cause):""}${x.ai?" • تحلیل Claude":""}</div>
   <div style="white-space:pre-wrap;margin:4px 0;font-size:14px">${esc(x.body)}</div>${x.summary?`<div class="m">خلاصه: ${esc(x.summary)}</div>`:""}
   <details><summary style="font-size:13px">اصلاح دسته‌بندی</summary><div class="grid2" style="margin-top:6px">
    <select data-smst="${x.id}">${Object.entries(SMS_T).map(([k,v])=>`<option value="${k}" ${x.type===k?"selected":""}>${v}</option>`).join("")}</select>

const IDB={db:null,
 open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open("sb_photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));},
 async put(k,v){const d=await this.open();return new Promise((res,rej)=>{const tx=d.transaction("p","readwrite");tx.objectStore("p").put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});},
 async get(k){try{const d=await this.open();return await new Promise(res=>{const r=d.transaction("p").objectStore("p").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);});}catch(e){return null}},
 async del(k){try{const d=await this.open();await new Promise(res=>{const tx=d.transaction("p","readwrite");tx.objectStore("p").delete(k);tx.oncomplete=res;tx.onerror=res;});}catch(e){}}};
function compress(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
   c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.72));};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"))};img.src=url;});}
async function hydratePhotos(){for(const img of document.querySelectorAll("img[data-photo]")){if(img.getAttribute("src"))continue;const d=await IDB.get(img.dataset.photo);if(d)img.src=d;}}

async function tryUnlock(){const v=toEn(gv("pinIn"));if((await sha(v))===LS.get("pin","")){const el=document.getElementById("lock");el.hidden=true;el.innerHTML="";}
  else{const m=document.getElementById("pinMsg");if(m)m.textContent="رمز اشتباه است.";}}
document.addEventListener("visibilitychange",()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>60000)showLock();});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target&&e.target.id==="pinIn")tryUnlock();});
document.addEventListener("click",e=>{if(e.target&&e.target.id==="modal")modalClose();});

function vTasks(kind){
  const list=openTasks(kind), done=S.tasks.filter(t=>t.kind===kind&&t.status==="done").slice(-8).reverse();
  const presets = kind==="pm"
    ? ["تعویض روغن و فیلتر","گریس‌کاری شاسی و درام","بازدید سیستم ترمز","بررسی لاستیک و باد","سرویس کمپرسور","بازدید تسمه و بلبرینگ نوار نقاله"]
    : ["شستشوی کامل بدنه","شستشوی درام و شوت","رسوب‌زدایی و اسیدشویی","رنگ و رفع خوردگی","نظافت کابین","برچسب و لوگوی شرکت"];
  return `
  <div class="card"><h3>${kindName(kind)}</h3>
    <div class="note">${kind==="pm"
      ?"کارهای دوره‌ای را با فاصله زمانی ثبت کنید؛ با زدن «انجام شد» تاریخ بعدی خودکار تنظیم می‌شود."
      :"برنامه شستشو و زیباسازی ناوگان؛ ظاهر ناوگان مستقیم روی اعتماد مشتری اثر دارد."}</div>
    <div class="chips">${presets.map(p=>`<button class="chip" data-preset="${p}">${p}</button>`).join("")}</div>
    <details id="taskForm"><summary>افزودن کار جدید</summary>
      <label>عنوان کار</label><input id="tt" placeholder="عنوان">
      <label>دستگاه</label><select id="tm"><option value="">عمومی</option>
        ${S.machines.map(m=>`<option value="${m.id}">${m.name}</option>`).join("")}</select>
      <div class="grid2">
        <div><label>تاریخ سررسید</label>${jdate("td",todayISO())}</div>
        <div><label>دوره تکرار (روز)</label><input id="ti" type="number" inputmode="numeric" placeholder="${kind==="pm"?"30":"7"}"></div>
        ${kind==="pm"?`<div><label>یا هر چند ساعت/کیلومتر</label><input id="tu" type="number" inputmode="numeric" placeholder="مثلاً ۲۵۰"></div>`:""}
      </div>
      <label>اولویت</label><select id="tp"><option>عادی</option><option>مهم</option><option>بحرانی</option></select>
      <label>توضیح</label><textarea id="tx" placeholder="قطعات لازم، نفرات، نکات ایمنی..."></textarea>
      <div class="row" style="margin-top:9px"><button class="primary" data-addt="${kind}">ثبت کار</button></div>
    </details>
  </div>
  <div class="card"><h3>کارهای باز (${fa(list.length)})</h3>
    ${list.length?list.map(t=>{const[s,c]=st(t);return `<div class="item">
      <div class="t">${t.title}<span class="tag ${c}">${s}</span></div>
      <div class="m">${mName(t.machineId)} • اولویت ${t.priority||"عادی"}${t.interval?` • هر ${fa(t.interval)} روز`:""}${t.usageInterval?` • هر ${fa(t.usageInterval)} ${unitName(S.machines.find(x=>x.id===t.machineId))}`:""}</div>
      ${t.notes?`<div class="m">${t.notes}</div>`:""}
      <div class="row" style="margin-top:7px">
        <button class="ghost" data-done="${t.id}">انجام شد</button>
        <button class="ghost" data-snooze="${t.id}">۳ روز بعد</button>
        <button class="danger" data-delt="${t.id}">حذف</button></div></div>`}).join("")
      :'<div class="empty">کار بازی وجود ندارد.</div>'}
  </div>
  ${done.length?`<div class="card"><h3>انجام‌شده‌های اخیر</h3>
    ${done.map(t=>`<div class="item"><div class="t">${t.title}</div><div class="m">${mName(t.machineId)} • ${jal(t.lastDone)}</div></div>`).join("")}</div>`:""}
  ${kind==="wash"?washExtra():""}`;
}

function vBatchProd(){
  const p=[...S.prod].sort((a,b)=>a.date.localeCompare(b.date));
  const l=p.slice(-14);
  const tot=p.reduce((s,x)=>s+(+x.volume||0),0);
  const rej=p.reduce((s,x)=>s+(+x.reject||0),0);
  const cem=p.filter(x=>+x.cement>0);
  const avgCem=cem.length?cem.reduce((s,x)=>s+ +x.cement,0)/cem.length:0;
  const tasks=openTasks("batch");
  return `
  <div class="kpis">
    <div class="kpi"><div class="n">${fa(Math.round(tot))}</div><div class="l">تولید کل (م³)</div></div>
    <div class="kpi"><div class="n">${fa(avgCem.toFixed(0))}</div><div class="l">میانگین سیمان (kg/m³)</div></div>
    <div class="kpi"><div class="n" style="color:var(--bad)">${fa(rej.toFixed(1))}</div><div class="l">بتن برگشتی (م³)</div></div>
    <div class="kpi"><div class="n">${fa(p.reduce((s,x)=>s+(+x.downtime||0),0))}</div><div class="l">توقف کل (دقیقه)</div></div>
  </div>

function oeeDay(d){const p=S.prod.find(x=>x.date===d); if(!p||!(+p.volume>0)) return null;

async function chatSend(){const inp=document.getElementById("chatIn"), q=(inp&&inp.value||"").trim(); if(!q) return;
  const ch=LS.get("chat",[]); ch.push({r:"u",t:q}); LS.set("chat",ch.slice(-30)); inp.value="";
  const log=document.getElementById("chatLog"); log.innerHTML=chatHtml()+'<div class="msg a">در حال فکر کردن...</div>'; log.scrollTop=log.scrollHeight;
  const hist=ch.slice(-11,-1).map(m=>(m.r==="u"?"کاربر: ":"دستیار: ")+m.t).join("\n\n");
  let ans; try{ ans=await callClaude(`${ROLE}\nداده‌های کارخانه: ${dataContext()}\n\n${hist?"گفتگوی قبلی:\n"+hist+"\n\n":""}سؤال جدید کاربر: ${q}`); }
  catch(e){ ans="خطا: "+e.message; }
  const c2=LS.get("chat",[]); c2.push({r:"a",t:ans}); LS.set("chat",c2.slice(-30));

function summaryText(){

داده‌های فعلی کارخانه (JSON): ${dataContext()}

درخواست: ${q}`;
  try{
    const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),120000);
    const r=await fetch(cfg.url.replace(/\/+$/,"")+"/ask",{method:"POST",signal:ctl.signal,
      headers:{"content-type":"application/json","x-app-token":cfg.token},body:JSON.stringify({prompt})});

  }catch(e){
    box.textContent="خطا در ارتباط با سرور: "+(e.name==="AbortError"?"زمان پاسخ تمام شد":(e.message||"نامشخص"));
  }
}

/* ---------- اعلان‌های گوشی ---------- */
const LN=()=> (window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications)||null;
function nid(str){let h=0;for(const c of str)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%2000000000+1;}
async function syncNotifications(){
  const ln=LN(); if(!ln) return;
  try{
    const p=await ln.checkPermissions(); if(p.display!=="granted") return;
    const pend=await ln.getPending();
    if(pend.notifications&&pend.notifications.length) await ln.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const now=new Date(), list=[];
    for(const r of S.rem){
      const [h,m]=r.time.split(":").map(Number);
      if(r.repeat==="once"){
        const at=new Date(r.date+"T"+r.time+":00"); if(at<=now) continue;
        list.push({id:nid(r.id),title:"یادآوری",body:r.text,schedule:{at,allowWhileIdle:true}});
      }else{
        list.push({id:nid(r.id),title:"یادآوری",body:r.text,schedule:{on:{hour:h,minute:m},allowWhileIdle:true}});
      }
    }
    for(const m of S.machines) for(const [k,l] of DOCS){ if(!m[k]) continue;
      for(const off of [7,0]){ const at=new Date(addDays(m[k],-off)+"T09:00:00"); if(at<=now) continue;
        list.push({id:nid(m.id+k+off),title:"سررسید "+l,body:`${m.name}: ${l} ${off?"۷ روز دیگر":"امروز"} (${jal(m[k])})`,schedule:{at,allowWhileIdle:true}}); } }
    for(const t of S.tasks) if(t.kind==="dir"&&t.status!=="done"&&t.due){ const at=new Date(t.due+"T09:00:00");
      if(at>now) list.push({id:nid(t.id),title:"مهلت دستور مدیر",body:t.title,schedule:{at,allowWhileIdle:true}}); }
    for(const it of CAL_ITEMS){ const r=S.calib.filter(c=>c.item===it).sort((a,b)=>b.date.localeCompare(a.date))[0]; if(!r||!r.nextDue) continue;
      for(const off of [7,0]){ const at=new Date(addDays(r.nextDue,-off)+"T09:00:00"); if(at<=now) continue;
        list.push({id:nid(r.id+"cal"+off),title:"کالیبراسیون",body:`${it}: ${off?"۷ روز دیگر":"امروز"} سررسید است`,schedule:{at,allowWhileIdle:true}}); } }
    if(LS.get("attRemOn",true)&&staff().length){ const [ah,am]=String(LS.get("attRem","07:30")).split(":").map(Number);
      list.push({id:nid("att-remind"),title:"حضور و غیاب",body:"حضور و غیاب امروز رانندگان را ثبت کن.",schedule:{on:{hour:ah||7,minute:am||0},allowWhileIdle:true}}); }
    for(const c of drivers()) if(c.licDue) for(const off of [7,0]){ const at=new Date(addDays(c.licDue,-off)+"T09:00:00"); if(at<=now) continue;
      list.push({id:nid(c.id+"lic"+off),title:"گواهی‌نامه راننده",body:`${c.name}: ${off?"۷ روز دیگر":"امروز"} اعتبار گواهی‌نامه تمام می‌شود`,schedule:{at,allowWhileIdle:true}}); }
    const cfg_=LS.get("cfg",{}); if(cfg_.url&&cfg_.token) list.push({id:nid("weekly-analysis"),title:"تحلیل هفتگی",body:"اپ را باز کن تا تحلیل هفته گذشته آماده شود.",schedule:{on:{weekday:7,hour:9,minute:0},allowWhileIdle:true}});
    if(list.length) await ln.schedule({notifications:list});
  }catch(e){ console.log("notif",e); }
}
async function askNotifPermission(){
  const ln=LN(); if(!ln) return alert("اعلان فقط در نسخه نصبی اپ کار می‌کند.");
  try{
    const p=await ln.requestPermissions();
    if(p.display==="granted"){
      try{ const ex=await ln.checkExactNotificationSetting(); if(ex&&ex.exact_alarm!=="granted") await ln.changeExactNotificationSetting(); }catch(e){}
      await syncNotifications(); alert("اعلان‌ها فعال شد.");
    } else alert("اجازه اعلان داده نشد. از تنظیمات گوشی برای این اپ فعالش کنید.");
  }catch(e){ alert("خطا: "+(e.message||e)); }
}

    if(m&&(t.kind==="pm"||t.kind==="wash")){ const c=prompt("هزینه انجام کار به تومان (اختیاری):",""); if(c===null) return;
      await save("log",{id:uid(),machineId:m.id,date:todayISO(),title:t.title,kind:t.kind,usage:mUsage(m),cost:+toEn(c).replace(/[^\d]/g,"")||0});
      if(t.kind==="wash"){ const sc=+toEn(prompt("امتیاز ظاهر دستگاه بعد از شستشو از ۱ تا ۵ (اختیاری):","")||""); if(sc>=1&&sc<=5) await save("looks",{id:uid(),machineId:m.id,date:todayISO(),score:sc,notes:"بعد از شستشو"}); } }
    if(t.interval>0||t.usageInterval>0){ await save("tasks",Object.assign({},t,{lastDone:todayISO(),
        due:t.interval>0?addDays(todayISO(),t.interval):"",lastUsage:m?mUsage(m):t.lastUsage})); }
    else { await save("tasks",Object.assign({},t,{status:"done",lastDone:todayISO()})); } return; }
  if(b.dataset.dirdone){ const t=S.tasks.find(x=>x.id===b.dataset.dirdone); if(!t) return;
    const r=prompt("نتیجه یا توضیح کوتاه (اختیاری):",""); if(r===null) return;
    await save("tasks",Object.assign({},t,{status:"done",lastDone:todayISO(),result:r})); return; }
  if(b.id==="copyDir"){ const txt=dirReport(); try{ await navigator.clipboard.writeText(txt); b.textContent="کپی شد"; }catch(e){ alert(txt); }
    setTimeout(()=>b.textContent="کپی گزارش پیگیری برای مدیر",1200); return; }
  if(b.dataset.snooze){ const t=S.tasks.find(x=>x.id===b.dataset.snooze); if(t) await save("tasks",Object.assign({},t,{due:addDays(t.due||todayISO(),3)})); return; }
  if(b.dataset.delt){ if(confirm("حذف شود؟")) await del("tasks",b.dataset.delt); return; }

  if(b.id==="addP"){ const d=g("pd"); if(!d) return alert("تاریخ را وارد کنید.");
    const ex=S.prod.find(x=>x.date===d);
    await save("prod",{id:ex?ex.id:uid(),date:d,volume:+g("pv")||0,grade:g("pg"),cement:+g("pc")||0,
      downtime:+g("pt")||0,reject:+g("pr")||0,notes:g("pn")}); await syncDown(d); return; }
  if(b.dataset.delp){ if(confirm("حذف شود؟")) await del("prod",b.dataset.delp); return; }

  if(b.dataset.q){ document.getElementById("aq").value=b.dataset.q; await ask(b.dataset.q); return; }
  if(b.id==="ask"){ const q=g("aq"); if(!q) return alert("سؤال را بنویسید."); await ask(q); return; }
  if(b.id==="saveIdea"){ if(!lastAnswer) return alert("ابتدا یک پاسخ بگیرید.");
    await save("ideas",{id:uid(),title:(document.getElementById("aq").value||"پیشنهاد").slice(0,60),text:lastAnswer,date:todayISO(),status:"پیشنهاد",source:"Claude",cat:"سایر"}); alert("در دفترچه ایده‌ها ذخیره شد."); return; }
  if(b.id==="copyAns"){ navigator.clipboard&&navigator.clipboard.writeText(lastAnswer||""); b.textContent="کپی شد"; setTimeout(()=>b.textContent="کپی پاسخ",1200); return; }
  if(b.id==="copySum"){ navigator.clipboard&&navigator.clipboard.writeText(summaryText()); b.textContent="کپی شد"; setTimeout(()=>b.textContent="کپی متن",1200); return; }
  if(b.dataset.deli){ if(confirm("حذف شود؟")) await del("ideas",b.dataset.deli); return; }
});
document.addEventListener("change",async e=>{const el=e.target;
  if(el&&el.dataset&&el.dataset.idst){ const i=S.ideas.find(x=>x.id===el.dataset.idst); if(i) await save("ideas",Object.assign({},i,{status:el.value,statusDate:todayISO()})); }
  if(el&&el.id==="autoBk") LS.set("autoBk",el.checked);
  if(el&&el.id==="smsAi") LS.set("smsAi",el.checked);
  if(el&&el.dataset&&el.dataset.attst){ await attSet(el.dataset.attst,{status:el.value}); return; }
  if(el&&el.dataset&&el.dataset.atth){ await attSet(el.dataset.atth,{hours:+toEn(el.value)||0}); return; }
  if(el&&el.dataset&&el.dataset.atto){ await attSet(el.dataset.atto,{ot:+toEn(el.value)||0}); return; }
  if(el&&el.id==="smsNotify"){ LS.set("smsNotify",el.checked); pushWatch(); }
  const sid=el&&el.dataset&&(el.dataset.smst||el.dataset.smsc||el.dataset.smsm||el.dataset.smsmc);
  if(sid){ const x=S.sms.find(y=>y.id===sid); if(!x) return; const u={edited:true};
    if(el.dataset.smst) u.type=el.value; if(el.dataset.smsc) u.cause=el.value||null; if(el.dataset.smsm) u.minutes=+toEn(el.value)||null; if(el.dataset.smsmc) u.machineId=el.value;
    await save("sms",Object.assign({},x,u)); }});
addEventListener("hashchange",()=>{const h=location.hash.slice(1); if(TABS.some(t=>t[0]===h)&&h!==tab){tab=h;render();}});


render(); load();
</script>
